{% if post.id %}
  {% assign title = post.title | markdownify | remove: "<p>" | remove: "</p>" %}
{% else %}
  {% assign title = post.title %}
{% endif %}

<li class="item">
  <h3 class="item-title"><a href="{{ post.url }}">{{ title }}</a></h3>
  {% if post.citation %}<p class="item-excerpt">{{ post.citation }}</p>{% endif %}
</li>
